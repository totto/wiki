name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.2 mkdocs-rss-plugin mkdocs-git-revision-date-localized-plugin
      - name: Deploy
        run: |
          ok=0
          for i in 1 2 3; do
            mkdocs gh-deploy --force && ok=1 && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::All gh-deploy attempts failed"
            exit 1
          fi
